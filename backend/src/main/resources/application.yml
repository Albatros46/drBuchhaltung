server:
  port: 8080

spring:
  application:
    name: rechnio
  # Lokal: dateibasierte H2-Datenbank in ./data (kein DB-Server noetig).
  # Fuer Produktion: Profil "postgres" aktivieren (siehe application-postgres.yml).
  datasource:
    url: jdbc:h2:file:./data/rechnio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Eingehende E-Rechnungen (ZUGFeRD-PDFs koennen Anhaenge enthalten)
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
  # Rechnungsversand. Lokal: Test-Postfach Mailpit auf localhost:1025 (Weboberflaeche http://localhost:8025).
  # Produktion: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD und MAIL_STARTTLS=true setzen.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  h2:
    console:
      enabled: true
      path: /h2-console

rechnio:
  jwt:
    # Nur fuer lokale Entwicklung. In Produktion per Umgebungsvariable RECHNIO_JWT_SECRET setzen (min. 32 Zeichen).
    secret: ${RECHNIO_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl-hours: 12
  cors:
    allowed-origins: http://localhost:8081,http://localhost:19006
  mail:
    # Absenderadresse; die E-Mail-Adresse der Firma wird als Reply-To gesetzt.
    # Viele SMTP-Anbieter erlauben nur eigene Absender, daher nicht die Firmenadresse als From.
    from: ${MAIL_FROM:rechnung@rechnio.local}
